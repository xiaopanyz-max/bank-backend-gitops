apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/xiaopanyz-max/bank-backend-gitops.git
    targetRevision: main
    path: k8s/overlays/sit-cluster-b
  destination:
    server: https://kubernetes.default.svc
    namespace: bank
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
