# Copy this file to secret.yaml, replace both placeholder values, then apply it.
# Never commit secret.yaml. The values must match the dedicated Windows MySQL user.
apiVersion: v1
kind: Secret
metadata:
  name: bank-local-secrets
  namespace: bank
type: Opaque
stringData:
  MYSQL_USERNAME: bank_k8s
  MYSQL_PASSWORD: REPLACE_WITH_A_STRONG_WINDOWS_MYSQL_PASSWORD
