apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - env-config.yaml
patches:
  - path: replicas-patch.yaml
  - target:
      group: discovery.k8s.io
      version: v1
      kind: EndpointSlice
      name: mysql-windows-host
    patch: |-
      - op: replace
        path: /endpoints/0/addresses/0
        value: 10.46.132.206
  - target:
      version: v1
      kind: ConfigMap
      name: fluent-bit-config
      namespace: logging
    patch: |-
      - op: replace
        path: /data/fluent-bit.conf
        value: |
          [SERVICE]
              Flush         5
              Daemon        Off
              Log_Level     info
              Parsers_File  parsers.conf

          [INPUT]
              Name              tail
              Tag               kube.*
              Path              /var/log/containers/*_bank_*.log
              Parser            cri
              DB                /tmp/flb_kube_bank.db
              Mem_Buf_Limit     20MB
              Skip_Long_Lines   On
              Refresh_Interval  10

          [FILTER]
              Name                kubernetes
              Match               kube.*
              Kube_URL            https://kubernetes.default.svc:443
              Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
              Kube_Tag_Prefix     kube.var.log.containers.
              Merge_Log           On
              Keep_Log            On
              Labels              On
              Annotations         Off

          [FILTER]
              Name                parser
              Match               kube.*
              Key_Name            log
              Parser              spring_log_level
              Reserve_Data        On
              Preserve_Key        On

          [OUTPUT]
              Name                es
              Match               kube.*
              Host                10.46.132.23
              Port                9200
              Index               bank-k8s-logs
              Logstash_Format     On
              Logstash_Prefix     bank-k8s
              Suppress_Type_Name  On
              Retry_Limit         False
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: nacos
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: customer-service
    patch: &recreate-strategy |-
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: account-service
    patch: *recreate-strategy
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api-gateway
    patch: *recreate-strategy
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: nacos
    patch: *recreate-strategy
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: rocketmq-nameserver
    patch: *recreate-strategy
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: rocketmq-broker
    patch: *recreate-strategy
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: rocketmq-nameserver
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: rocketmq-broker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "-Xms96m -Xmx128m -Xmn32m -XX:MaxDirectMemorySize=64m -XX:-AlwaysPreTouch -XX:ParallelGCThreads=1 -XX:ConcGCThreads=1"
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: init-rocketmq-hostpath
            image: busybox:1.36
            command:
              - sh
              - -c
              - chmod -R 0777 /rocketmq-store /rocketmq-logs
            securityContext:
              runAsUser: 0
            volumeMounts:
              - name: data
                mountPath: /rocketmq-store
              - name: logs
                mountPath: /rocketmq-logs
