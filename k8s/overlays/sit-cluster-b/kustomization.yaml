apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - env-config.yaml

# Keep image tags here as well as in the root kustomization, because the
# cluster-b Argo CD Application points directly at this overlay.
images:
  - name: ghcr.io/xiaopanyz-max/bank-customer-service
    newTag: sha-3d92294e9235cabaadf15fd00ff9824b45309c24
  - name: ghcr.io/xiaopanyz-max/bank-account-service
    newTag: sha-3d92294e9235cabaadf15fd00ff9824b45309c24
  - name: ghcr.io/xiaopanyz-max/bank-api-gateway
    newTag: sha-3d92294e9235cabaadf15fd00ff9824b45309c24

patches:
  - path: replicas-patch.yaml
  - target:
      group: discovery.k8s.io
      version: v1
      kind: EndpointSlice
      name: mysql-windows-host
    patch: |-
      - op: replace
        path: /endpoints/0/addresses/0
        value: 10.46.132.206
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: nacos
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: customer-service
    patch: &recreate-strategy |-
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: account-service
    patch: *recreate-strategy
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api-gateway
    patch: *recreate-strategy
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: nacos
    patch: *recreate-strategy
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: rocketmq-nameserver
    patch: *recreate-strategy
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: rocketmq-broker
    patch: *recreate-strategy
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: rocketmq-nameserver
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: rocketmq-broker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "-Xms96m -Xmx128m -Xmn32m -XX:MaxDirectMemorySize=64m -XX:-AlwaysPreTouch -XX:ParallelGCThreads=1 -XX:ConcGCThreads=1"
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: init-rocketmq-hostpath
            image: busybox:1.36
            command:
              - sh
              - -c
              - chmod -R 0777 /rocketmq-store /rocketmq-logs
            securityContext:
              runAsUser: 0
            volumeMounts:
              - name: data
                mountPath: /rocketmq-store
              - name: logs
                mountPath: /rocketmq-logs
