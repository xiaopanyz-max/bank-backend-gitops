apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - env-config.yaml
patches:
  - path: replicas-patch.yaml
  - target:
      group: discovery.k8s.io
      version: v1
      kind: EndpointSlice
      name: mysql-windows-host
    patch: |-
      - op: replace
        path: /endpoints/0/addresses/0
        value: 10.46.132.206
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: nacos
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: rocketmq-nameserver
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: rocketmq-broker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
