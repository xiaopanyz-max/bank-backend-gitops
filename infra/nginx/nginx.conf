# Local single entrypoint for the bank backend dual-cluster SIT environment.
#
# This file is the source-controlled nginx configuration. The nginx installation
# directory copy is only a deployment artifact.
#
# Traffic flow:
#   Postman/browser -> 127.0.0.1:18080 -> nginx -> cluster-a / cluster-b api-gateway NodePort

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream bank_gateway {
        # cluster-a, primary SIT cluster
        server 192.168.30.130:30080 weight=9;

        # cluster-b, secondary SIT cluster
        server 10.46.132.20:30080 weight=1;
    }

    server {
        listen       18080;
        server_name  localhost;

        location / {
            proxy_pass http://bank_gateway;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
